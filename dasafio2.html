<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UseCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="bg-gray-900 text-white">
    
    <!-- Cabeçalho fixo no topo - sempre visível -->
    <header class="fixed top-0 left-0 right-0 bg-gray-800 shadow-lg z-50">
        <div class="flex items-center justify-between px-6 py-3">
            
            <!-- Lado esquerdo: Menu e Logo -->
            <div class="flex items-center space-x-4">
                <!-- Ícone de Menu Hamburger -->
                <button class="text-yellow-500 text-2xl hover:text-yellow-400">
                    ☰
                </button>
                
                <!-- Logo UseCloud com badge DEV -->
                <div class="flex items-center space-x-2">
                    <span class="text-yellow-500 font-bold text-xl">UseCloud</span>
                    <span class="bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded">DEV</span>
                </div>
            </div>
            
            <!-- Centro: Dropdowns -->
            <div class="flex items-center space-x-4 absolute left-1/2 transform -translate-x-1/2">
                <!-- Dropdown Dev Cloud -->
                <select class="bg-gray-700 text-white text-sm px-4 py-1.5 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    <option>Dev Cloud</option>
                </select>
                
                <!-- Dropdown Empresa -->
                <select class="bg-gray-700 text-white text-sm px-4 py-1.5 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-500 min-w-[400px]">
                    <option>ZEEBEE - JM INDÚSTRIA DE CONFECÇÕES E MARKETING LTDA</option>
                </select>
            </div>
            
            <!-- Lado direito: Informações do usuário -->
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-gray-600 flex items-center justify-center overflow-hidden">
                    <span class="text-sm font-semibold">👤</span>
                </div>
                <div class="text-sm text-right">
                    <div class="font-medium">Olá, Ian B.</div>
                    <div class="text-gray-400 text-xs">Desenvolvedor</div>
                </div>
            </div>
            
        </div>
    </header>
    
    <!-- Espaçamento para compensar o header fixo -->
    <div class="h-16"></div>
    
    <!-- Conteúdo principal -->
    <main id="main-content" class="p-6">
        <!-- Título com ícone -->
        <div class="flex items-center space-x-2 mb-6">
            <span class="text-yellow-500 text-2xl">👥</span>
            <h1 class="text-2xl font-semibold">Gerenciamento de Clientes</h1>
        </div>

        <!-- Barra de pesquisa -->
        <div class="mb-6 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <span class="text-sm text-gray-400">Tipo</span>
                <select class="bg-gray-700 text-white text-sm px-3 py-2 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    <option>Conteúdo</option>
                </select>
                
                <span class="text-sm text-gray-400">Conteúdo</span>
                <input 
                    type="text" 
                    placeholder="DIGITE O TEXTO A SER PESQUISADO" 
                    class="bg-gray-700 text-white text-sm px-4 py-2 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-500 placeholder-gray-500 w-96"
                />
            </div>
            
           
            <button class="bg-orange-500 hover:bg-orange-600 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl font-bold transition leading-none">
                +
            </button>
        </div>

        <!-- Tabela de clientes -->
        <div class="bg-gray-800 rounded-lg overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-700">
                    <tr class="text-left text-xs uppercase text-gray-400">
                        <th class="px-4 py-3">CÓDIGO</th>
                        <th class="px-4 py-3">NOME</th>
                        <th class="px-4 py-3">CPF/CNPJ</th>
                        <th class="px-4 py-3">EMAIL</th>
                        <th class="px-4 py-3">TELEFONE</th>
                        <th class="px-4 py-3">AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="clientes-tbody" class="divide-y divide-gray-700">
                </tbody>
            </table>
        </div>

        
        <div class="flex justify-end items-center space-x-3 mt-6">
            <button 
                id="btn-anterior" 
                class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-300 hover:text-white rounded text-sm transition-all duration-200 shadow-sm hover:shadow-md"
                aria-label="Página anterior"
            >
                Anterior
            </button>
            <div id="paginas-container" class="flex space-x-2">
                
            </div>
            <button 
                id="btn-proxima" 
                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm transition-all duration-200 shadow-sm hover:shadow-md"
                aria-label="Próxima página"
            >
                Próxima
            </button>
        </div>
    </main>

    <!-- Modal de Visualização do Cliente -->
    <div id="modal-cliente" class="hidden fixed top-16 left-0 right-0 bottom-0 bg-black bg-opacity-75 z-40 overflow-y-auto">
        <div class="bg-gray-900 min-h-full p-8">
            
            <!-- Cabeçalho do Modal -->
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center space-x-2">
                    <span class="text-yellow-500 text-2xl">👥</span>
                    <h2 class="text-2xl font-semibold text-white">Gerenciamento de Clientes</h2>
                </div>
                <!-- Botão Voltar estilo "Ghost" mas com fundo sutil -->
                <button id="btn-voltar" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white px-4 py-2 rounded flex items-center space-x-2 transition text-sm">
                    <span>←</span>
                    <span>Voltar aos Clientes</span>
                </button>
            </div>

            <!-- Seção: Identificação -->
            <div class="mb-8">
                <h3 class="flex items-center text-sm font-semibold mb-4 text-yellow-500 uppercase tracking-wide">
                    <span class="mr-2">👤</span> Identificação
                </h3>
                
                <!-- Grid de 12 colunas para alinhamento perfeito -->
                <div class="grid grid-cols-12 gap-4">
                    
                    <!-- Linha 1 -->
                    <!-- Código (Pequeno) -->
                    <div class="col-span-1">
                        <label class="block text-xs text-gray-400 mb-1 font-medium">Código</label>
                        <input id="modal-codigo" type="text" class="w-full bg-gray-800 border border-gray-700 text-gray-400 px-3 py-2 rounded text-sm focus:outline-none focus:border-blue-500" readonly>
                    </div>
                    
                    <!-- Pessoa (Médio) -->
                    <div class="col-span-2">
                        <label class="block text-xs text-gray-400 mb-1 font-medium">Pessoa</label>
                        <select class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none">
                            <option>Jurídica</option>
                            <option>Física</option>
                        </select>
                    </div>
                    
                    <!-- Tipo (Largo) -->
                    <div class="col-span-3">
                        <label class="block text-xs text-gray-400 mb-1 font-medium">Tipo</label>
                        <select class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none">
                            <option>VENDAS</option>
                        </select>
                    </div>
                    
                    <!-- CNPJ (Com ícone de busca) -->
                    <div class="col-span-2">
                        <label class="block text-xs text-gray-400 mb-1 font-medium">CNPJ</label>
                        <div class="relative">
                            <input id="modal-cnpj" type="text" class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none">
                            <span class="absolute right-3 top-2 text-yellow-500 cursor-pointer">🔍</span>
                        </div>
                    </div>
                    
                    <!-- CPF (Desabilitado visualmente) -->
                    <div class="col-span-2">
                        <label class="block text-xs text-gray-400 mb-1 font-medium">CPF</label>
                        <input type="text" placeholder="CPF" class="w-full bg-gray-800 border border-gray-700 text-gray-600 px-3 py-2 rounded text-sm focus:outline-none disabled:opacity-50" disabled>
                    </div>
                    
                    <!-- Inscrição Estadual -->
                    <div class="col-span-2">
                        <label class="block text-xs text-gray-400 mb-1 font-medium">Inscrição Estadual</label>
                        <input type="text" value="9089827202" class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none">
                    </div>

                    <!-- Linha 2 -->
                    <!-- Razão Social (Metade) -->
                    <div class="col-span-6">
                        <label class="block text-xs text-gray-400 mb-1 font-medium">Razão Social</label>
                        <input id="modal-nome" type="text" class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none">
                    </div>
                    
                    <!-- Nome Fantasia (Metade) -->
                    <div class="col-span-6">
                        <label class="block text-xs text-gray-400 mb-1 font-medium">Nome Fantasia</label>
                        <input type="text" value="USE SISTEMAS" class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Linha divisória sutil -->
            <hr class="border-gray-800 my-8">

            <!-- Grid Dividido: Contato (Esq) e Fiscal (Dir) -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <!-- Coluna Esquerda: Contato e Localização -->
                <section>
                    <h3 class="flex items-center text-sm font-semibold mb-4 text-yellow-500 uppercase tracking-wide">
                        <span class="mr-2">🗺️</span> Contato e Localização
                    </h3>
                    
                    <div class="grid grid-cols-12 gap-4">
                        <!-- Linha 1: Telefone, Fax, Região -->
                        <div class="col-span-4">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Telefone</label>
                            <input id="modal-telefone" type="text" class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none">
                        </div>
                        <div class="col-span-4">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Fax</label>
                            <input type="text" placeholder="FAX" class="w-full bg-gray-800 border border-gray-700 text-gray-600 px-3 py-2 rounded text-sm focus:outline-none">
                        </div>
                        <div class="col-span-4">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Região</label>
                            <select class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none appearance-none">
                                <option></option>
                            </select>
                        </div>

                        <!-- Linha 2: Email (Largura total) -->
                        <div class="col-span-12">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">E-mail NFE/Boletos</label>
                            <input id="modal-email" type="email" class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none">
                        </div>

                        <!-- Linha 3: Indicação, Ramo -->
                        <div class="col-span-4">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Indicação</label>
                            <select class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none appearance-none">
                                <option></option>
                            </select>
                        </div>
                        <div class="col-span-8">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Ramo/Profissão</label>
                            <select class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none appearance-none">
                                <option></option>
                            </select>
                        </div>
                    </div>
                </section>

                <!-- Coluna Direita: Configurações Fiscais -->
                <section>
                    <h3 class="flex items-center text-sm font-semibold mb-4 text-yellow-500 uppercase tracking-wide">
                        <span class="mr-2">📄</span> Configurações Fiscais
                    </h3>
                    
                    <div class="grid grid-cols-12 gap-4">
                        <!-- Linha 1: Indicador de IE (Largura total) -->
                        <div class="col-span-12">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Indicador de IE</label>
                            <select class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none appearance-none">
                                <option>CONTRIBUINTE ICMS (INFORMAR A IE DO DESTINATÁRIO)</option>
                            </select>
                        </div>

                        <!-- Linha 2: Regime, ID Estrangeiro -->
                        <div class="col-span-6">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Regime Tributário</label>
                            <select class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm focus:border-blue-500 focus:outline-none appearance-none">
                                <option>SIMPLES NACIONAL</option>
                            </select>
                        </div>
                        <div class="col-span-6">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">ID Estrangeiro</label>
                            <input type="text" placeholder="ID ESTRANGEIRO" class="w-full bg-gray-800 border border-gray-700 text-gray-600 px-3 py-2 rounded text-sm focus:outline-none">
                        </div>

                        <!-- Linha 3: Redespacho (Largura total) -->
                        <div class="col-span-12">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Redespacho</label>
                            <input type="text" placeholder="REDESPACHO" class="w-full bg-gray-800 border border-gray-700 text-gray-600 px-3 py-2 rounded text-sm focus:outline-none">
                        </div>
                    </div>
                </section>

            </div>

            <!-- Linha divisória antes da última seção -->
            <hr class="border-gray-800 my-8">

            <!-- Última Seção: Configurações de Pedido e Complemento -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <!-- Configurações de Pedido -->
                <section>
                    <h3 class="flex items-center text-sm font-semibold mb-4 text-yellow-500 uppercase tracking-wide">
                        <span class="mr-2">🛒</span> Configurações de Pedido
                    </h3>
                    <div class="grid grid-cols-12 gap-4">
                        <div class="col-span-9">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Tabela de Preço</label>
                            <select class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm appearance-none focus:border-blue-500 focus:outline-none">
                                <option></option>
                            </select>
                        </div>
                        <div class="col-span-3">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">% Desc</label>
                            <input type="text" placeholder="% DE DESC" class="w-full bg-gray-800 border border-gray-700 text-gray-600 px-3 py-2 rounded text-sm focus:outline-none">
                        </div>
                        <div class="col-span-6">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Limite de Crédito</label>
                            <input type="text" placeholder="LIMITE DE CRÉDITO" class="w-full bg-gray-800 border border-gray-700 text-gray-600 px-3 py-2 rounded text-sm focus:outline-none">
                        </div>
                        <div class="col-span-6">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Crédito Liberado</label>
                            <select class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm appearance-none focus:border-blue-500 focus:outline-none">
                                <option></option>
                            </select>
                        </div>
                    </div>
                </section>

                <!-- Complemento -->
                <section>
                    <h3 class="flex items-center text-sm font-semibold mb-4 text-yellow-500 uppercase tracking-wide">
                        <span class="mr-2">☰</span> Complemento
                    </h3>
                    <div class="grid grid-cols-12 gap-4">
                        <div class="col-span-12">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Fornecedor</label>
                            <div class="relative">
                                <select class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm appearance-none focus:border-blue-500 focus:outline-none">
                                    <option>Nenhum Selecionado</option>
                                </select>
                                <span class="absolute right-3 top-2 text-yellow-500 cursor-pointer">🔍</span>
                            </div>
                        </div>
                        <div class="col-span-12">
                            <label class="block text-xs text-gray-400 mb-1 font-medium">Transportadora</label>
                            <select class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded text-sm appearance-none focus:border-blue-500 focus:outline-none">
                                <option></option>
                            </select>
                        </div>
                    </div>
                </section>

            </div>

            <div class="h-8"></div>
        </div>
    </div>

    

</body>
</html>
